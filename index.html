<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ludo Game</title>
</head>
<body>
    <h1>2 Player Dice Game</h1>
    <p id="turn">Player 1's turn</p>

    <div class="players">
      <div  id="p1" class="player active">
        <h2>Player 01</h2>
        <div class="dice" id="dice1">🎲</div>
        <div class="score">Score: <span id="score1">0</span></div>
      </div>

        <div  id="p2" class="player active ">
        <h2>Player 02</h2>
        <div class="dice" id="dice2">🎲</div>
        <div class="score">Score: <span id="score2">0</span></div>
      </div>
    </div>

  <button onclick="roll()">Roll Dice</button>
    <button onclick="reset()">Reset Game</button>

<script src="app.js"></script>
</body>
</html>
